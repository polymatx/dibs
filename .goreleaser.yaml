version: 2

project_name: dibs

before:
  hooks:
    - go mod tidy

builds:
  - id: dibs
    main: ./cmd/dibs
    binary: dibs
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/polymatx/dibs/internal/version.Version={{.Version}}
      - -X github.com/polymatx/dibs/internal/version.Commit={{.ShortCommit}}
      - -X github.com/polymatx/dibs/internal/version.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    **Install**: `go install github.com/polymatx/dibs/cmd/dibs@{{.Tag}}` or grab a binary above.
